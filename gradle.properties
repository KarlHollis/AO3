# JVM 参数
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# 构建加速
org.gradle.parallel=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 默认启用内置 Kotlin（内置 KGP 2.2.10），与 Kotlin 2.4.10 / Compose 1.12 不兼容。
# 这里显式关闭内置 Kotlin，改由 org.jetbrains.kotlin.android 插件提供 Kotlin 支持。
android.builtInKotlin=false

# AGP 9 默认启用新 DSL（android.newDsl=true），与 kotlin-android 插件不兼容。
# 暂时关闭新 DSL，采用兼容的经典 DSL（AGP 10 将移除该开关）。
android.newDsl=false

kotlin.code.style=official
